for(const p of pickups){if(!p.m.parent)continue;p.m.rotation.y+=dt*2;p.m.position.y=1+hg(p.z)+Math.sin(performance.now()/300)*.15;p.cool-=dt;if(Math.hypot(P.x-p.x,P.z-p.z)<1.5&&p.cool<=0&&!P.dead){const s=inv.indexOf(null);if(s<0){toast('Inventário cheio');p.cool=1.5}else{inv[s]=p.id;arena.remove(p.m);disp(p.m);toast('Coletou: '+ITEMS[p.id].n);sfx(900,.15,'sine',.2,300);rInv();save()}}}
shake=Math.max(0,shake-dt);const tx=P.x+(ap.x-P.x)*.07*set.sens,tz=P.z+(ap.z-P.z)*.07*set.sens,kk=1-Math.exp(-8*dt);
C.position.x+=(tx-C.position.x)*kk;C.position.y+=(15+hg(P.z)-C.position.y)*kk;C.position.z+=(tz+11-C.position.z)*kk;C.position.x+=(Math.random()-.5)*shake*(set.rs?0:1);C.lookAt(tx,hg(P.z),tz);

let rem=enemies.filter(e=>e.req&&e.st!='dead').length;if(rem==0&&AR[ai].w2&&!w2d){w2d=true;spawnN(Math.round(AR[ai].w2*1.6),'sol');toast('Reforços chegando!');rem=enemies.filter(e=>e.req&&e.st!='dead').length}if(rem==0&&!cleared&&enemies.length&&winT<0){cleared=true;if(ai<12){$('cont').style.display='block';toast('Arena concluída — siga a seta até o portal');if(exitG)exitG.visible=true}}

let lt='';function hud(rem){$('hpf').style.width=P.hp/CFG.hp*100+'%';$('hpt').textContent=Math.ceil(P.hp)+' / '+CFG.hp;$('mnf').style.width=P.mana/maxMana()*100+'%';$('mnt').textContent='Mana '+Math.floor(P.mana)+' / '+maxMana();$('en').textContent='Inimigos restantes: '+rem;$('wp').textContent='Cristal nv '+P.lvl+' · Arma: '+(P.weapon?ITEMS[P.weapon].n+' (dano '+ITEMS[P.weapon].dmg+')':'nenhuma — magia de gelo');
const cd=(id,v,m)=>{const el=$(id);el.style.setProperty('--p',v/m);el.classList.toggle('on',v<=0);el.querySelector('u').textContent=v>0?Math.ceil(v):''};cd('sq',P.novaCd,CFG.nova.cd);cd('se',P.dashCd,CFG.dash.cd);cd('sf',P.weapon?P.swCd:1,P.weapon?CFG.sword.cd:1);for(const [id,l,v,m] of [['sc',1,P.cC,4],['sr',3,P.cR,8],['sv',5,P.cV,20]]){cd(id,P.lvl>=l?v:m,m);$(id).style.opacity=P.lvl>=l?1:.3}
const b=enemies.find(e=>e.boss&&e.st!='dead'&&e.st!='idle');$('boss').style.display=b?'block':'none';if(b){$('bn').textContent=b.b.name;$('bf').style.width=b.hp/b.max*100+'%'}}
function rInv(){$('inv').innerHTML='<div class="invtitle">Inventário (clique para selecionar)</div>'+inv.map((id,i)=>{const t=id?ITEMS[id]:null,eq=id&&(P.weapon==id||Object.values(P.gear).includes(id));return '<div class="sl'+(sel==i?' sel':'')+'" onclick="selectSlot('+i+')"><em>'+(i+1)+'</em>'+(eq?'<span class="eq">E</span>':'')+(t?'<div class="sw" style="background:#'+t.c.toString(16).padStart(6,'0')+';box-shadow:0 0 8px #'+t.c.toString(16).padStart(6,'0')+'"></div>'+t.n:'')+'</div>'}).join('')+'<div id="gear"><b>Equipamento</b><br>'+[['ring','Anel'],['neck','Colar'],['armor','Armadura']].map(([k,n])=>'<button onclick="equipSelected(&quot;'+k+'&quot;)">'+n+': '+(P.gear[k]?ITEMS[P.gear[k]].n:'vazio')+'</button><button onclick="unequip(&quot;'+k+'&quot;)">Tirar</button>').join('')+'</div><button id="trash" onclick="discardSelected()">Descartar item selecionado</button>'}
function selectSlot(i){sel=i;rInv()}
function equipSelected(slot){const id=inv[sel],t=id&&ITEMS[id];if(!t||t.t!=slot){toast('Selecione um item compatível no inventário');return}P.gear[slot]=id;P.mana=Math.min(P.mana,maxMana());toast('Equipou '+t.n);save();rInv()}
function unequip(slot){P.gear[slot]=null;P.mana=Math.min(P.mana,maxMana());toast('Equipamento removido');save();rInv()}
function discardSelected(){const id=inv[sel];if(!id){toast('Selecione um item para descartar');return}if(P.weapon==id)P.weapon=null;for(const k of Object.keys(P.gear))if(P.gear[k]==id)P.gear[k]=null;P.mana=Math.min(P.mana,maxMana());inv[sel]=null;toast('Descartou '+ITEMS[id].n);save();rInv()}
function useSlot(i){if(state!='play'||P.dead)return;sel=i;const id=inv[i];if(id){const t=ITEMS[id];if(t.t=='w'){P.weapon=P.weapon==id?null:id;toast(P.weapon?'Equipou '+t.n:'Desequipou '+t.n)}else if(['ring','neck','armor'].includes(t.t)){P.gear[t.t]=P.gear[t.t]==id?null:id;toast(P.gear[t.t]?'Equipou '+t.n:'Desequipou '+t.n)}else{let u=0;if(t.heal&&P.hp<CFG.hp){P.hp=Math.min(CFG.hp,P.hp+t.heal);u=1}if(t.mana&&P.mana<maxMana()){P.mana=Math.min(maxMana(),P.mana+t.mana);u=1}if(u){inv[i]=null;toast('Usou '+t.n);sfx(600,.3,'sine',.2,400)}else toast('Sem efeito agora')}save()}rInv()}const weakSeen=new Set();function weakHint(k,msg){if(!weakSeen.has(k)){weakSeen.add(k);toast(msg)}}let tt;function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,2600)}
// ===== TELAS / CAMPANHA =====
const ov=$('ov');function scr(h){ov.innerHTML=h;ov.style.display='flex';setTimeout(()=>{const b=ov.querySelector('button');b&&b.focus()},50)}function hide(){ov.style.display='none'}
function save(){try{localStorage.setItem('lunarium_v1',JSON.stringify({v:3,acc:null,gear:P.gear,mana:P.mana,playTime:gameTime,cards:[...P.cards],lvl:P.lvl,arena:ai,inv,weapon:P.weapon,hp:P.hp,set}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('lunarium_v1'));if(!d||d.v!==3||!Number.isInteger(d.arena)||d.arena<0||d.arena>12||!Array.isArray(d.inv))return null;d.inv=d.inv.slice(0,8).map(x=>ITEMS[x]?x:null);while(d.inv.length<8)d.inv.push(null);d.gear=d.gear||{ring:null,neck:null,armor:null};if(!d.gear.ring&&ITEMS[d.acc]?.t=='ring')d.gear.ring=d.acc;if(!d.gear.neck&&ITEMS[d.acc]?.t=='neck')d.gear.neck=d.acc;for(const k of ['ring','neck','armor'])if(!d.inv.includes(d.gear[k])||ITEMS[d.gear[k]]?.t!=k)d.gear[k]=null;return d}catch(e){return null}}
function menu(){const d=load();if(d&&d.set&&d.set.dif)set.dif=d.set.dif;scr(`<div class="q">“O gelo ainda lembra seu nome.”</div><div class="mn"><h1>LUNARIUM</h1><p>${STORY.intro}</p><button onclick="begin(${d?'true':'false'})">${d?'Continuar — '+AR[d.arena].n:'Jogar'}</button>${d?'<br><button onclick="newGame()">Nova campanha</button>':''}<br><button onclick="cycDif(this)">Dificuldade: ${DIF[set.dif].n}</button></div>`)}
function begin(cont){AC=AC||new (window.AudioContext||window.webkitAudioContext)();const d=cont&&load();inv.fill(null);P.weapon=null;P.acc=null;P.gear={ring:null,neck:null,armor:null};P.mana=100;gameTime=0;CFG.lv=0;P.hp=CFG.hp;ai=0;P.lvl=0;P.cards=new Set();if(d){d.inv.forEach((x,i)=>inv[i]=x);P.weapon=inv.includes(d.weapon)?d.weapon:null;ai=d.arena;P.lvl=Math.max(0,Math.min(12,d.lvl|0));CFG.lv=P.lvl;P.acc=null;P.gear=d.gear||P.gear;P.mana=Math.max(0,Math.min(maxMana(),Number.isFinite(d.mana)?d.mana:100));gameTime=Math.max(0,Number.isFinite(d.playTime)?d.playTime:0);P.cards=new Set((d.cards||[]).filter(Number.isInteger));P.hp=Math.max(30,Math.min(CFG.hp,d.hp||CFG.hp));{const dd=set.dif;Object.assign(set,d.set||{});set.dif=dd}}
$('hud').style.display='block';hide();startArena(ai,false)}
function newGame(){if(load()&&!confirm('Apagar o progresso salvo e começar uma nova campanha?'))return;try{localStorage.removeItem('lunarium_v1')}catch(e){}begin(false)}
function startArena(i,adv){ai=i;clearArena();build(i);cleared=false;winT=-1;P.x=0;P.z=15;P.vx=P.vz=0;P.dashT=0;P.hurtT=0;P.dead=false;P.g.rotation.set(0,0,0);P.g.position.set(0,0,15);P.fx=0;P.fz=-1;P.g.visible=true;
if(adv)P.hp=Math.min(CFG.hp,P.hp+CFG.adv);C.position.set(0,15,26);$('cont').style.display='none';$('an').textContent=AR[i].n;state='play';rInv();toast(AR[i].txt);save();last=performance.now();ap.set(0,1,0);ambient(i);const a=AR[i];if(a.free&&exitG){cleared=true;exitG.visible=true}
if(a.pro){P.peace=true;cut(OPEN,()=>({x:P.x,z:P.z-8}),null)}else P.peace=false;if(i!=12&&a.boss&&BOSS[a.boss].intro)cut([BOSS[a.boss].name.split(' — ')[0]+'|'+BOSS[a.boss].intro],()=>{const e=enemies.find(x=>x.boss);return e?{x:e.x,z:e.z}:{x:0,z:-9}},null);if(i==12)cut(KAYN0,()=>{const e=enemies.find(x=>x.t=='kayn');return e?{x:e.x,z:e.z}:{x:0,z:-9}},null)}
const UNL={1:'Poder desperto: C — Estilhaços de Gelo',3:'Poder desperto: R — Raio Congelante',5:'Poder desperto: V — Tempestade de Gelo'};

<div id="ct" style="display:none"><p>WASD/setas: mover · Mouse: mirar · Clique: gelo · Q: Nova (10s) · E: Esquiva · F: Espada · C/R/V: poderes de cristal (desbloqueados ao ingerir Cristal) · Shift: furtivo · Tab: inventário (o combate continua) · 1-8: equipar/usar · Esc: pausa. Poderes gastam mana.</p></div><div id="cd" style="display:none;max-height:40vh;overflow:auto">${[...P.cards].sort((a,b)=>a-b).map(i=>`<p><b>${LORE[i][0]}</b><br>${LORE[i][1]}</p>`).join('')||'<p>Nenhuma carta ainda.</p>'}</div>`)}
